<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBM - Selector de Acceso</title>
    <style>
        body {
            background-color: #121212;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            width: 90%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            text-align: center;
        }
        h2 {
            margin-bottom: 10px;
            font-size: 1.5rem;
            color: #58a6ff;
        }
        p {
            color: #8b949e;
            font-size: 0.9rem;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .btn {
            background: #161b22;
            color: #fff;
            border: 1px solid #30363d;
            padding: 16px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn:hover {
            background: #1f6feb;
            border-color: #388bfd;
            transform: translateY(-2px);
        }
        .btn-local {
            border-color: #238636;
        }
        .btn-local:hover {
            background: #2ea043;
            border-color: #3fb950;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>SBM Gateway</h2>
        <p>Selecciona tu ubicación actual para acceder al servidor:</p>

        <a href="http://192.168.10.159:5080/" class="btn btn-local">
            🏠 En Casa (Local)
        </a>

        <a href="http://nubesbm.tail9ccf37.ts.net:5080/" class="btn">
            🌍 Fuera de Casa (Remoto)
        </a>
    </div>

</body>
</html>
