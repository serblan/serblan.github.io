<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none';">
<title>SBM - Selector de Acceso</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    background: #121212; color: #fff; margin: 0; min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  .container {
    width: 90%; max-width: 360px; display: flex; flex-direction: column;
    gap: 15px; text-align: center; align-items: center;
  }
  h2 { margin: 0 0 10px; font-size: 1.5rem; color: #58a6ff; }
  p { color: #8b949e; font-size: .9rem; margin: 0 0 20px; }
  .btn {
    background: #161b22; color: #fff; border: 1px solid #30363d; padding: 16px;
    border-radius: 12px; font-size: 1.1rem; font-weight: bold; cursor: pointer;
    transition: all .2s ease; display: flex; align-items: center; justify-content: center;
    gap: 10px; width: 100%;
  }
  .btn:hover:not(:disabled) { background: #1f6feb; border-color: #388bfd; transform: translateY(-2px); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-local { border-color: #238636; }
  .btn-local:hover:not(:disabled) { background: #2ea043; border-color: #3fb950; }
  input, textarea {
    background: #0d1117; border: 1px solid #30363d; color: #fff; padding: 12px;
    border-radius: 8px; font-size: 1rem; width: 100%; outline: none; font-family: inherit;
  }
  input:focus, textarea:focus { border-color: #58a6ff; }
  textarea { font-family: ui-monospace, monospace; font-size: .75rem; height: 140px; resize: vertical; }
  .error { color: #f85149; font-size: .85rem; min-height: 1.2em; margin: 0; }
  .ok { color: #3fb950; font-size: .85rem; }
  .hidden { display: none !important; }
  label { align-self: flex-start; font-size: .8rem; color: #8b949e; }
</style>
</head>
<body>

<!-- Pantalla de bloqueo -->
<div class="container" id="lock-screen">
  <h2>Acceso Restringido</h2>
  <p>Introduce tu contraseña:</p>
  <input type="password" id="pwd" autocomplete="current-password" autofocus>
  <p class="error" id="errorMsg"></p>
  <button class="btn" id="unlockBtn">Desbloquear</button>
</div>

<!-- Modo configuración (primer uso o #setup): genera el bloque cifrado -->
<div class="container hidden" id="setup-screen">
  <h2>Configuración inicial</h2>
  <p>Genera el bloque cifrado y pégalo en la constante <code>ENCRYPTED_BLOB</code>.</p>
  <label>Contraseña (mín. 12 caracteres, mejor una frase)</label>
  <input type="password" id="s-pwd" autocomplete="new-password">
  <label>Repite la contraseña</label>
  <input type="password" id="s-pwd2" autocomplete="new-password">
  <label>URL local</label>
  <input type="url" id="s-local" placeholder="http://192.168.x.x:5080/">
  <label>URL remota</label>
  <input type="url" id="s-remote" placeholder="http://host.ts.net:5080/">
  <p class="error" id="s-err"></p>
  <button class="btn" id="genBtn">Generar bloque cifrado</button>
  <textarea id="s-out" class="hidden" readonly></textarea>
</div>

<!-- Menú de ubicación -->
<div class="container hidden" id="main-content">
  <h2>SBM Gateway</h2>
  <p>Selecciona tu ubicación actual:</p>
  <button class="btn btn-local" data-loc="local">🏠 En Casa (Local)</button>
  <button class="btn" data-loc="remote">🌍 Fuera de Casa (Remoto)</button>
  <button class="btn" id="logoutBtn">🔒 Cerrar sesión</button>
</div>

<!-- Menú de servicios -->
<div class="container hidden" id="services-content">
  <h2>Servicios disponibles</h2>
  <p id="location-indicator"></p>
  <button class="btn" data-svc="iptv">📺 IPTV</button>
  <button class="btn" data-svc="galenas">💾 GaleNAS</button>
  <button class="btn" data-svc="tvoptimizer">⚙️ TV Optimizer</button>
  <button class="btn" id="backBtn">⬅️ Cambiar ubicación</button>
</div>

<script>
(() => {
  'use strict';

  // ───────────── CONFIGURACIÓN ─────────────
  // Se rellena con el bloque generado en el modo configuración (index.html#setup).
  // Contiene SOLO texto cifrado: sin la contraseña no revela nada.
  const ENCRYPTED_BLOB = "CXvKCzFwofCaZk3+Ss43oW5OG0JvqWOPUtiLkEc9x+1kEIIEiLOG0WOPvOXhnNHPevwp8/CrAou6wY2pdPvhxwgZQ/ZLzbbvwCxKv1yqVgDWZL09Gnky48fX3jpAGUfBN4OPTny7zZNiGCn6JS4VyTArzFVEsU3TnwgL";

  const PBKDF2_ITERATIONS = 600000;   // coste de fuerza bruta por intento
  const SESSION_TTL_MS    = 15 * 60 * 1000;
  const SESSION_KEY       = 'sbm_session';
  const FAIL_KEY          = 'sbm_fails';
  const PORTS = { iptv: '', galenas: '5080', tvoptimizer: '8090' };

  // ───────────── UTILIDADES ─────────────
  const $ = id => document.getElementById(id);
  const enc = new TextEncoder(), dec = new TextDecoder();
  const toB64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const fromB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const show = id => $(id).classList.remove('hidden');
  const hide = id => $(id).classList.add('hidden');

  async function deriveKey(password, salt, usages) {
    const base = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt, iterations: PBKDF2_ITERATIONS, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, usages);
  }

  async function encryptPayload(password, obj) {
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const key = await deriveKey(password, salt, ['encrypt']);
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(JSON.stringify(obj)));
    const out = new Uint8Array(16 + 12 + ct.byteLength);
    out.set(salt, 0); out.set(iv, 16); out.set(new Uint8Array(ct), 28);
    return toB64(out);
  }

  async function decryptPayload(password, blob) {
    const raw = fromB64(blob);
    const key = await deriveKey(password, raw.slice(0, 16), ['decrypt']);
    // AES-GCM autentica: con contraseña incorrecta lanza excepción
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: raw.slice(16, 28) }, key, raw.slice(28));
    return JSON.parse(dec.decode(pt));
  }

  // ───────────── LÍMITE DE INTENTOS (disuasorio) ─────────────
  function getFails() {
    try { return JSON.parse(localStorage.getItem(FAIL_KEY)) || { n: 0, until: 0 }; }
    catch { return { n: 0, until: 0 }; }
  }
  function setFails(f) { try { localStorage.setItem(FAIL_KEY, JSON.stringify(f)); } catch {} }

  // ───────────── ESTADO ─────────────
  let payload = null;      // { local, remote } — solo en memoria tras descifrar
  let location_ = null;

  function startSession(p) {
    payload = p;
    try { sessionStorage.setItem(SESSION_KEY, JSON.stringify({ exp: Date.now() + SESSION_TTL_MS, p })); } catch {}
    hide('lock-screen'); show('main-content');
  }

  function endSession() {
    payload = null; location_ = null;
    try { sessionStorage.removeItem(SESSION_KEY); } catch {}
    hide('main-content'); hide('services-content'); show('lock-screen');
    $('pwd').value = ''; $('pwd').focus();
  }

  function restoreSession() {
    try {
      const s = JSON.parse(sessionStorage.getItem(SESSION_KEY));
      if (s && s.exp > Date.now() && s.p && s.p.local && s.p.remote) { startSession(s.p); return true; }
      sessionStorage.removeItem(SESSION_KEY);
    } catch {}
    return false;
  }

  // ───────────── DESBLOQUEO ─────────────
  async function unlock() {
    const err = $('errorMsg'), btn = $('unlockBtn');
    const f = getFails();
    if (Date.now() < f.until) {
      err.textContent = `Demasiados intentos. Espera ${Math.ceil((f.until - Date.now()) / 1000)} s.`;
      return;
    }
    const pwd = $('pwd').value;
    if (!pwd) return;
    btn.disabled = true; err.textContent = 'Verificando…';
    try {
      const p = await decryptPayload(pwd, ENCRYPTED_BLOB);
      setFails({ n: 0, until: 0 });
      err.textContent = '';
      $('pwd').value = '';
      startSession(p);
    } catch {
      const n = f.n + 1;
      const wait = n >= 3 ? Math.min(2 ** (n - 3) * 5000, 15 * 60 * 1000) : 0;
      setFails({ n, until: Date.now() + wait });
      err.textContent = wait ? `Contraseña incorrecta. Bloqueado ${Math.ceil(wait / 1000)} s.` : 'Contraseña incorrecta.';
      $('pwd').value = '';
    } finally {
      btn.disabled = false;
    }
  }

  // ───────────── NAVEGACIÓN ─────────────
  function selectLocation(type) {
    location_ = type;
    hide('main-content'); show('services-content');
    $('location-indicator').textContent = type === 'local'
      ? 'Conectando desde Casa (Local)' : 'Conectando desde Fuera de Casa (Remoto)';
  }

  function navigateTo(service) {
    if (!payload || !location_ || !(service in PORTS)) return;
    let u;
    try { u = new URL(payload[location_]); } catch { return; }
    if (u.protocol !== 'http:' && u.protocol !== 'https:') return;
    u.port = PORTS[service];
    window.location.href = u.toString();
  }

  // ───────────── MODO CONFIGURACIÓN ─────────────
  async function generate() {
    const err = $('s-err'), out = $('s-out');
    const pwd = $('s-pwd').value, pwd2 = $('s-pwd2').value;
    const local = $('s-local').value.trim(), remote = $('s-remote').value.trim();
    err.textContent = ''; out.classList.add('hidden');
    if (pwd.length < 12) { err.textContent = 'La contraseña debe tener al menos 12 caracteres.'; return; }
    if (pwd !== pwd2) { err.textContent = 'Las contraseñas no coinciden.'; return; }
    try { new URL(local); new URL(remote); } catch { err.textContent = 'URLs no válidas.'; return; }
    $('genBtn').disabled = true; err.textContent = 'Generando…';
    try {
      const blob = await encryptPayload(pwd, { local, remote });
      out.value = `const ENCRYPTED_BLOB = "${blob}";`;
      out.classList.remove('hidden');
      err.innerHTML = '<span class="ok">Listo. Copia esta línea sustituyendo la constante vacía.</span>';
    } finally { $('genBtn').disabled = false; }
  }

  // ───────────── ARRANQUE ─────────────
  if (!window.isSecureContext || !crypto.subtle) {
    document.body.innerHTML = '<p class="error" style="display:block">Se requiere HTTPS.</p>';
    return;
  }

  if (!ENCRYPTED_BLOB || location.hash === '#setup') {
    hide('lock-screen'); show('setup-screen');
    $('genBtn').addEventListener('click', generate);
    return;
  }

  $('unlockBtn').addEventListener('click', unlock);
  $('pwd').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });
  $('logoutBtn').addEventListener('click', endSession);
  $('backBtn').addEventListener('click', () => { location_ = null; hide('services-content'); show('main-content'); });
  document.querySelectorAll('[data-loc]').forEach(b => b.addEventListener('click', () => selectLocation(b.dataset.loc)));
  document.querySelectorAll('[data-svc]').forEach(b => b.addEventListener('click', () => navigateTo(b.dataset.svc)));

  restoreSession();
})();
</script>
</body>
</html>
