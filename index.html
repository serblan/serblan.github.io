<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBM - Selector de Acceso</title>
    <style>
        body {
            background-color: #121212;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            width: 90%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            text-align: center;
            align-items: center; /* Asegura que los hijos estén perfectamente centrados */
        }
        h2 {
            margin-bottom: 10px;
            font-size: 1.5rem;
            color: #58a6ff;
        }
        p {
            color: #8b949e;
            font-size: 0.9rem;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .btn {
            background: #161b22;
            color: #fff;
            border: 1px solid #30363d;
            padding: 16px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            box-sizing: border-box;
        }
        .btn:hover {
            background: #1f6feb;
            border-color: #388bfd;
            transform: translateY(-2px);
        }
        .btn-local {
            border-color: #238636;
        }
        .btn-local:hover {
            background: #2ea043;
            border-color: #3fb950;
        }
        #pin-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #121212;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        /* Input numérico centrado y adaptado */
        input[type="password"], input.pin-input {
            background: #0d1117;
            border: 1px solid #30363d;
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            font-size: 1.4rem;
            text-align: center;
            width: 200px;
            outline: none;
            margin-bottom: 15px;
            letter-spacing: 8px;
        }
        input[type="password"]:focus, input.pin-input:focus {
            border-color: #58a6ff;
        }
        .error {
            color: #f85149;
            font-size: 0.85rem;
            margin-bottom: 10px;
            display: none;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- Capa de bloqueo por PIN -->
    <div id="pin-overlay">
        <div class="container">
            <h2>Acceso Restringido</h2>
            <p>Introduce tu PIN numérico:</p>
            <!-- Usamos type="password" con patrón numérico para forzar teclado de números y ocultar los dígitos -->
            <input type="password" inputmode="numeric" pattern="[0-9]*" id="pinInput" placeholder="••••" maxlength="8" autofocus>
            <div id="errorMsg" class="error">PIN incorrecto</div>
            <button class="btn" onclick="verifyPin()">Desbloquear</button>
        </div>
    </div>

    <!-- Contenido principal -->
    <div class="container hidden" id="main-content">
        <h2>SBM Gateway</h2>
        <p>Selecciona tu ubicación actual para acceder al servidor:</p>

        <a href="#" id="btnLocal" class="btn btn-local">
            🏠 En Casa (Local)
        </a>

        <a href="#" id="btnRemote" class="btn">
            🌍 Fuera de Casa (Remoto)
        </a>
    </div>

    <script>
        
        const CORRECT_HASH = "4127bccc19dff8f72c5914cda39b6f6817aee3c5653c680837321e5406decabb";

        // 🔒 URLs CODIFICADAS EN BASE64
        const ENC_LOCAL = "aHR0cDovLzE5Mi4xNjguMTAuMTU5OjUwODAv";
        const ENC_REMOTE = "aHR0cDovL251YmVzYm0udGFpbDljY2YzNy50cy5uZXQ6NTA4MC8=";

        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function verifyPin() {
            const inputVal = document.getElementById("pinInput").value;
            const inputHash = await sha256(inputVal);

            if (inputHash === CORRECT_HASH) {
                document.getElementById("btnLocal").href = atob(ENC_LOCAL);
                document.getElementById("btnRemote").href = atob(ENC_REMOTE);

                document.getElementById("pin-overlay").classList.add("hidden");
                document.getElementById("main-content").classList.remove("hidden");
            } else {
                document.getElementById("errorMsg").style.display = "block";
                document.getElementById("pinInput").value = "";
            }
        }

        document.getElementById("pinInput").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                verifyPin();
            }
        });
    </script>
</body>
</html>
